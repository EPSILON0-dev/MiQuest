[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "miquest-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "pillow>=11,<14",
  "python-multipart>=0.0.20,<1",
  "emoji>=2.15,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.9,<1", "pyright==1.1.414", "pre-commit>=4,<5"]

[tool.setuptools.packages.find]
include = ["miquest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
miquest = "miquest.runtime:main"

[tool.pyright]
include = ["miquest", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.setuptools.package-data]
"miquest.api" = ["openapi.json"]
"miquest" = ["fixture.json"]
